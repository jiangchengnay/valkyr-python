[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "valkyr"
version = "0.1.0"
description = "Python bindings for Valkyr — pure Zig + Vulkan LLM inference (torch-like API)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.20",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["valkyr"]

[tool.setuptools.package-data]
valkyr = ["*.dll", "*.so", "*.dylib"]